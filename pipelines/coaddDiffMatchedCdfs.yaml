        )
        if parameters.patches:
          selector_comp = CompositeSelector()
          if ":" in parameters.patches:
            selector_tract_patches = CompositeSelector(combine_by_and=False)
            for tract_string in parameters.patches.split(";"):
              tract, patches = tract_string.split(":")
              values = [int(x) for x in patches.split(",")]
              selector_tract = MatchedTractSelector(tract=int(tract), patches=values) if patches else (
                SetSelector(vectorKeys=["tract", "refcat_tract"], values=[tract]))
              setattr(selector_tract_patches.selectors, f"tract_{tract}", selector_tract)
            selector_comp.selectors.tract_patches = selector_tract_patches
          else:
            values = [int(x) for x in parameters.patches.split(",")]
            selector_comp = CompositeSelector()
            selector_comp.selectors.patch = SetSelector(
              vectorKeys=["patch", "refcat_patch"],
              values=values,
            )
          selector_comp.selectors.candidate = selector_candidate
          selector_candidate = selector_comp

