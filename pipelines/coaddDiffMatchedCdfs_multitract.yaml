description:
  Multitract version of CDFS matched difference
imports:
  - location: $SCIUNIT_GALAXIES_DIR/pipelines/coaddDiffMatchedCdfs.yaml
    labeledSubsetModifyMode: EDIT
    exclude:
      diff_matched_cdfs_acs
    rename:
      diff_matched_cdfs_des_y6gold: diff_matched_cdfs_des_y6gold_multitract
      diff_matched_cdfs_euclid: diff_matched_cdfs_euclid_multitract
tasks:
  diff_matched_cdfs_des_y6gold_multitract:
    class: lsst.analysis.tools.tasks.DiffMatchedAnalysisTask
    config:
      connections.outputName: diff_matched_cdfs_des_y6gold_multitract

      load_multiple: True
  diff_matched_cdfs_euclid_multitract:
    class: lsst.analysis.tools.tasks.DiffMatchedAnalysisTask
    config:
      connections.outputName: diff_matched_euclid_q1_object_multitract

      load_multiple: True
