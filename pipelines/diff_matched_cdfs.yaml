description: Catalog matching and analysis for HSC with COSMOS
imports:
  - location: $SCIUNIT_GALAXIES_DIR/pipelines/diff_matched_wide.yaml
parameters:
  bands_match_acs: ["i"]
  cdfs_acs_coord_ra: "ra_gaia"
  cdfs_acs_coord_dec: "dec_gaia"
  cdfs_jades_coord_ra: "RA"
  cdfs_jades_coord_dec: "DEC"
  columns_hlf_copy: [
    "id", "class_star",
    "ra", "dec", "ra_gaia", "dec_gaia",
    "f_f225w", "e_f225w", "f_f275w", "e_f275w",
    "f_f336w", "e_f336w", "f_f435w", "e_f435w",
    "f_f606w", "e_f606w", "f_f775w", "e_f775w",
    "f_f814w", "e_f814w", "f_f850lp", "e_f850lp",
    "f_f098m", "e_f098m", "f_f105w", "e_f105w",
    "f_f125w", "e_f125w", "f_f140w", "e_f140w",
    "f_f160w", "e_f160w",
    "z_spec", "star_flag", "flags", "detection_flag", "kron_radius", "flux_radius", "patch",
  ]
  columns_jades_v2_copy: [
    "ID", "RA", "DEC",
    "F090W_FLAG", "F115W_FLAG", "F150W_FLAG", "F090W_TEXP", "F115W_TEXP", "F150W_TEXP",
    "F090W_WHT", "F115W_WHT", "F150W_WHT",
    "FLAG_ST", "FLAG_BS", "FLAG_BN",
    "R_KRON", "A", "B", "FWHM",
    "F090W_RHALF", "F115W_RHALF", "F150W_RHALF",
    "F090W_SEG", "F115W_SEG", "F150W_SEG", "F090W_KRON", "F115W_KRON", "F150W_KRON",
    "F090W_SEG_e", "F115W_SEG_e", "F150W_SEG_e", "F090W_KRON_e", "F115W_KRON_e", "F150W_KRON_e",
    "F090W_SEG_ei", "F115W_SEG_ei", "F150W_SEG_ei", "F090W_KRON_ei", "F115W_KRON_ei", "F150W_KRON_ei",
  ]
  columns_jades_v5_copy: [
    "ID", "RA", "DEC", "patch", "FLAG_BN",
    "F090W_FLAG", "F115W_FLAG", "F150W_FLAG", "F090W_TEXP", "F115W_TEXP", "F150W_TEXP",
    "F090W_WHT", "F115W_WHT", "F150W_WHT",
    "R_KRON_U", "A_KRON", "B_KRON", "THETA_KRON",
    "A", "B", "FWHM", "THETA", "GINI",
    "A_KRON_S", "B_KRON_S", "THETA_KRON_S",
    "F070W_KRON", "F090W_KRON", "F115W_KRON", "F150W_KRON", "F435W_KRON", "F606W_KRON", "F775W_KRON", "F814W_KRON",
    "F070W_KRON_S", "F090W_KRON_S", "F115W_KRON_S", "F150W_KRON_S", "F435W_KRON_S", "F606W_KRON_S", "F775W_KRON_S", "F814W_KRON_S",
    "F070W_KRON_e", "F090W_KRON_e", "F115W_KRON_e", "F150W_KRON_e", "F435W_KRON_e", "F606W_KRON_e", "F775W_KRON_e", "F814W_KRON_e",
    "F070W_KRON_ei", "F090W_KRON_ei", "F115W_KRON_ei", "F150W_KRON_ei", "F435W_KRON_ei", "F606W_KRON_ei", "F775W_KRON_ei", "F814W_KRON_ei",
    "F070W_KRON_S_e", "F090W_KRON_S_e", "F115W_KRON_S_e", "F150W_KRON_S_e", "F435W_KRON_S_e", "F606W_KRON_S_e", "F775W_KRON_S_e", "F814W_KRON_S_e",
    "F070W_KRON_S_ei", "F090W_KRON_S_ei", "F115W_KRON_S_ei", "F150W_KRON_S_ei", "F435W_KRON_S_ei", "F606W_KRON_S_ei", "F775W_KRON_S_ei", "F814W_KRON_S_ei",
    "pz_z_spec", "pz_z_a", "pz_z_ml", "pz_chi_a",
    "pz_l68", "pz_u68", "pz_l95", "pz_u95", "pz_l99", "pz_u99",
    "pz_nfilt", "pz_z_peak", "pz_chi_peak",
    "pz_z025", "pz_z160", "pz_z500", "pz_z840", "pz_z975",
    "pz_Prob_gt_5", "pz_Prob_gt_6", "pz_Prob_gt_7", "pz_Prob_gt_8", "pz_Prob_gt_9",
    "pz_chisq_z_lt_7", "pz_z_chisq_z_lt_7", "pz_chisq_z_lt_6", "pz_z_chisq_z_lt_6",
    "pz_chisq_z_lt_5", "pz_z_chisq_z_lt_5", "pz_chisq_z_lt_4", "pz_z_chisq_z_lt_4",
    "pz_kron_z_spec", "pz_kron_z_a", "pz_kron_z_ml", "pz_kron_chi_a",
    "pz_kron_l68", "pz_kron_u68", "pz_kron_l95", "pz_kron_u95", "pz_kron_l99", "pz_kron_u99",
    "pz_kron_nfilt", "pz_kron_z_peak", "pz_kron_chi_peak", "pz_kron_z025",
    "pz_kron_z160", "pz_kron_z500", "pz_kron_z840", "pz_kron_z975",
    "pz_kron_Prob_gt_5", "pz_kron_Prob_gt_6", "pz_kron_Prob_gt_7", "pz_kron_Prob_gt_8", "pz_kron_Prob_gt_9",
    "pz_kron_chisq_z_lt_7", "pz_kron_z_chisq_z_lt_7", "pz_kron_chisq_z_lt_6", "pz_kron_z_chisq_z_lt_6",
    "pz_kron_chisq_z_lt_5", "pz_kron_z_chisq_z_lt_5", "pz_kron_chisq_z_lt_4", "pz_kron_z_chisq_z_lt_4",
  ]
  prefix_acs: "hst_"
  prefix_jades: "jades_"
tasks:
  match_object_to_cdfs_acs:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: cdfs_hlf_v2p1
      connections.name_input_cat_target: object
      match_tract_catalog.mag_faintest_ref: 29.0
      match_tract_catalog.columns_ref_copy: ["id"]
      match_tract_catalog.columns_target_copy: ["objectId"]
      match_tract_catalog.coord_format.column_ref_coord1: parameters.cdfs_acs_coord_ra
      match_tract_catalog.coord_format.column_ref_coord2: parameters.cdfs_acs_coord_dec
      refcat_sharding_type: "none"
      diff_matched_catalog.columns_target_coord_err: ["coord_raErr", "coord_decErr"]
      diff_matched_catalog.coord_format.column_ref_coord1: parameters.cdfs_acs_coord_ra
      diff_matched_catalog.coord_format.column_ref_coord2: parameters.cdfs_acs_coord_dec
      diff_matched_catalog.include_unmatched: true
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask
        from lsst.pipe.tasks.diff_matched_tract_catalog import MatchedCatalogFluxesConfig

        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)

        fluxes_ref = ["f_f775w"]
        config.match_tract_catalog.columns_ref_flux = fluxes_ref
        config.match_tract_catalog.columns_ref_meas = [
          parameters.cdfs_acs_coord_ra, parameters.cdfs_acs_coord_dec,
        ] + fluxes_ref
        fluxes_meas = [f"{band}_sersicFlux" for band in parameters.bands_match_acs]
        columns_meas = ["coord_ra", "coord_dec"] + fluxes_meas
        config.match_tract_catalog.columns_target_meas = columns_meas
        config.match_tract_catalog.columns_target_err = [f"{col}Err" for col in columns_meas]

        columns_flux = {}
        fluxes_meas_other = []
        for band in parameters.bands_lsst:
            if band in parameters.bands_match_acs:
                columns_flux[band] = MatchedCatalogFluxesConfig(
                    column_ref_flux=f"f_f775w",
                    columns_target_flux=[f"{band}_sersicFlux",],
                    columns_target_flux_err=[f"{band}_sersicFluxErr",],
                )
            else:
                fluxes_meas_other.append(f"{band}_sersicFlux")
            for model in parameters.models_other:
                fluxes_meas_other.append(f"{band}_{model}Flux")

        config.diff_matched_catalog.columns_flux = columns_flux
        config.diff_matched_catalog.columns_ref_copy = parameters.columns_hlf_copy
        config.diff_matched_catalog.columns_target_copy = parameters.columns_obj_copy + fluxes_meas_other + [
          f"{col}Err" for col in fluxes_meas_other
        ] + (parameters.columns_exponential_copy if "exponential" in parameters.models_other else [])
  match_object_to_cdfs_jades_v2p0:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: cdfs_jades_v2p0
      connections.name_input_cat_target: object
      match_tract_catalog.columns_ref_copy: parameters.columns_jades_v2_copy
      match_tract_catalog.columns_target_copy: parameters.columns_obj_copy
      match_tract_catalog.coord_format.column_ref_coord1: parameters.cdfs_jades_coord_ra
      match_tract_catalog.coord_format.column_ref_coord2: parameters.cdfs_jades_coord_dec
      match_tract_catalog.mag_faintest_ref: 28
      refcat_sharding_type: "none"
      diff_matched_catalog.coord_format.column_ref_coord1: parameters.cdfs_jades_coord_ra
      diff_matched_catalog.coord_format.column_ref_coord2: parameters.cdfs_jades_coord_dec
      diff_matched_catalog.columns_target_coord_err: ["sersic_raErr", "sersic_decErr"]
      diff_matched_catalog.include_unmatched: true
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask
        from lsst.pipe.tasks.diff_matched_tract_catalog import MatchedCatalogFluxesConfig

        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)

        fluxes_ref = ["F090W_SEG"]
        config.match_tract_catalog.columns_ref_flux = fluxes_ref
        config.match_tract_catalog.columns_ref_meas = [
          parameters.cdfs_jades_coord_ra, parameters.cdfs_jades_coord_dec,
        ] + fluxes_ref
        fluxes_meas = [f"{band}_sersicFlux" for band in parameters.bands_match_acs]
        columns_meas = ["sersic_ra", "sersic_dec"] + fluxes_meas
        config.match_tract_catalog.columns_target_meas = columns_meas
        config.match_tract_catalog.columns_target_err = [f"{col}Err" for col in columns_meas]

      python: |
        from lsst.pipe.tasks.diff_matched_tract_catalog import MatchedCatalogFluxesConfig
        columns_flux = {}
        fluxes_meas_other = []
  match_cdfs_des_y6gold_to_cdfs_acs:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: cdfs_hlf_v2p1
      connections.name_input_cat_target: des_y6gold
      match_multiple_target: true
      refcat_sharding_type: "none"
      match_tract_catalog.coord_format.column_ref_coord1: parameters.cdfs_acs_coord_ra
      match_tract_catalog.coord_format.column_ref_coord2: parameters.cdfs_acs_coord_dec
      match_tract_catalog.coord_format.column_target_coord1: parameters.des_y6gold_coord_ra
      match_tract_catalog.coord_format.column_target_coord2: parameters.des_y6gold_coord_dec
      match_tract_catalog.mag_faintest_ref: 29.0
      match_tract_catalog.match_dist_max: 1.0
      diff_matched_catalog.column_matched_prefix_ref: parameters.prefix_acs
      diff_matched_catalog.column_matched_prefix_target: parameters.prefix_des_y6g
      diff_matched_catalog.columns_target_coord_err: ["ra_err", "dec_err"]
      diff_matched_catalog.coord_format.column_ref_coord1: parameters.cdfs_acs_coord_ra
      diff_matched_catalog.coord_format.column_ref_coord2: parameters.cdfs_acs_coord_dec
      diff_matched_catalog.coord_format.column_target_coord1: parameters.des_y6gold_coord_ra
      diff_matched_catalog.coord_format.column_target_coord2: parameters.des_y6gold_coord_dec
      diff_matched_catalog.include_unmatched: true
      diff_matched_catalog.prefix_best_coord: "coord_best_"
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask
        from lsst.pipe.tasks.diff_matched_tract_catalog import MatchedCatalogFluxesConfig
        
        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)
        fluxes_ref = ["f_f775w"]
        config.match_tract_catalog.columns_ref_flux = fluxes_ref
        config.match_tract_catalog.columns_ref_meas = [
          parameters.cdfs_acs_coord_ra, parameters.cdfs_acs_coord_dec,
        ] + fluxes_ref

        fluxes_meas = [f"bdf_flux_i_corrected"]
        config.match_tract_catalog.columns_target_meas = [
          parameters.des_y6gold_coord_ra, parameters.des_y6gold_coord_dec,
        ] + fluxes_meas

        config.match_tract_catalog.columns_target_err = [
          "ra_err", "dec_err", f"bdf_flux_err_i_corrected",
        ]
        # Might need adjusting for different survey depths
        config.match_tract_catalog.columns_ref_copy = parameters.columns_hlf_copy
        config.match_tract_catalog.columns_target_copy = ["coadd_object_id"]

        fluxes_meas_other = [f"bdf_flux_{band}_corrected" for band in parameters.bands_match_des_y6gold]
        config.diff_matched_catalog.columns_ref_copy = parameters.columns_hlf_copy
        config.diff_matched_catalog.columns_target_copy = [
          parameters.des_y6gold_coord_ra, parameters.des_y6gold_coord_dec,
        ] + parameters.columns_des_y6gold_copy + fluxes_meas_other + [
          f"bdf_flux_err_{band}_corrected" for band in parameters.bands_match_des_y6gold
        ]
  match_object_to_cdfs_acs_des_y6gold:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: matched_cdfs_hlf_v2p1_des_y6gold
      connections.name_input_cat_target: object
      match_tract_catalog.coord_format.column_ref_coord1: coord_best_ra
      match_tract_catalog.coord_format.column_ref_coord2: coord_best_dec
      match_tract_catalog.mag_faintest_ref: 29.0
      diff_matched_catalog.prefix_best_coord: "coord_best_"
      diff_matched_catalog.column_matched_prefix_ref: ""
      diff_matched_catalog.columns_target_coord_err: ["sersic_raErr", "sersic_decErr"]
      diff_matched_catalog.coord_format.column_ref_coord1: coord_best_ra
      diff_matched_catalog.coord_format.column_ref_coord2: coord_best_dec
      diff_matched_catalog.include_unmatched: true
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask
        from lsst.pipe.tasks.diff_matched_tract_catalog import MatchedCatalogFluxesConfig
        
        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)

        fluxes_ref = [f"{parameters.prefix_acs}f_f775w", f"{parameters.prefix_des_y6g}bdf_flux_i_corrected"]
        config.match_tract_catalog.columns_ref_flux = fluxes_ref
        config.match_tract_catalog.columns_ref_meas = [
          f"{parameters.prefix_acs}{parameters.cdfs_acs_coord_ra}",
          f"{parameters.prefix_acs}{parameters.cdfs_acs_coord_dec}",
          f"{parameters.prefix_des_y6g}{parameters.des_y6gold_coord_ra}",
          f"{parameters.prefix_des_y6g}{parameters.des_y6gold_coord_dec}",
        ] + fluxes_ref
        fluxes_meas = ["i_sersicFlux", "i_sersicFlux"]
        columns_meas = ["sersic_ra", "sersic_dec", "sersic_ra", "sersic_dec"] + fluxes_meas
        config.match_tract_catalog.columns_target_meas = columns_meas
        config.match_tract_catalog.columns_target_err = [f"{col}Err" for col in columns_meas]
        # Might need adjusting for different survey depths
        config.match_tract_catalog.columns_ref_copy = [
          f"{parameters.prefix_acs}id", f"{parameters.prefix_des_y6g}coadd_object_id",
        ]
        config.match_tract_catalog.columns_target_copy = ["objectId"]

        columns_flux = {}
        fluxes_meas_other = []
        for band in parameters.bands_lsst:
            if band in parameters.bands_match_acs:
                columns_flux[band] = MatchedCatalogFluxesConfig(
                    column_ref_flux=f"{parameters.prefix_acs}f_f775w",
                    columns_target_flux=[f"{band}_sersicFlux",],
                    columns_target_flux_err=[f"{band}_sersicFluxErr",],
                )
            else:
                fluxes_meas_other.append(f"{band}_sersicFlux")
            for model in parameters.models_other:
                fluxes_meas_other.append(f"{band}_{model}Flux")
        config.diff_matched_catalog.columns_flux = columns_flux
        config.diff_matched_catalog.columns_target_copy = parameters.columns_obj_copy + fluxes_meas_other + [
          f"{col}Err" for col in fluxes_meas_other
        ] + (parameters.columns_exponential_copy if "exponential" in parameters.models_other else [])
        prefix_matched = "matched_"
        config.diff_matched_catalog.column_matched_prefix_ref = prefix_matched 
        config.diff_matched_catalog.columns_ref_copy = [
          f"{parameters.prefix_acs}{col_ref}" for col_ref in parameters.columns_hlf_copy
        ] + [
          f"{parameters.prefix_des_y6g}{col_ref}" for col_ref in [
            parameters.des_y6gold_coord_ra, parameters.des_y6gold_coord_dec,
          ] + parameters.columns_des_y6gold_copy + [
            f"bdf_flux_err_{band}_corrected" for band in parameters.bands_match_des_y6gold
          ]
        ]
  match_cdfs_acs_to_cdfs_jades_v5p0:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: cdfs_jades_v5p0
      connections.name_input_cat_target: cdfs_hlf_v2p1
      match_tract_catalog.columns_target_select_false: []
      match_tract_catalog.columns_target_select_true: []
      match_tract_catalog.coord_format.column_ref_coord1: parameters.cdfs_jades_coord_ra
      match_tract_catalog.coord_format.column_ref_coord2: parameters.cdfs_jades_coord_dec
      match_tract_catalog.coord_format.column_target_coord1: parameters.cdfs_acs_coord_ra
      match_tract_catalog.coord_format.column_target_coord2: parameters.cdfs_acs_coord_dec
      match_tract_catalog.match_dist_max: 0.5
      refcat_sharding_type: "none"
      target_sharding_type: "none"
      match_multiple_target: false
      diff_matched_catalog.columns_ref_copy: parameters.columns_jades_v5_copy
      diff_matched_catalog.columns_target_coord_err: ["ra_gaia_est_error", "dec_gaia_est_error"]
      diff_matched_catalog.columns_target_copy: parameters.columns_hlf_copy
      diff_matched_catalog.coord_format.column_ref_coord1: parameters.cdfs_jades_coord_ra
      diff_matched_catalog.coord_format.column_ref_coord2: parameters.cdfs_jades_coord_dec
      diff_matched_catalog.coord_format.column_target_coord1: parameters.cdfs_acs_coord_ra
      diff_matched_catalog.coord_format.column_target_coord2: parameters.cdfs_acs_coord_dec
      diff_matched_catalog.include_unmatched: true
      diff_matched_catalog.prefix_best_coord: "coord_mast_"
      diff_matched_catalog.refcat_sharding_type: "none"
      diff_matched_catalog.target_sharding_type: "none"
      diff_matched_catalog.column_matched_prefix_ref: parameters.prefix_jades
      diff_matched_catalog.column_matched_prefix_target: parameters.prefix_acs
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask

        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)
        fluxes_ref = ["F070W_KRON", "F070W_KRON", "F090W_KRON"]
        config.match_tract_catalog.columns_ref_meas = [
          parameters.cdfs_jades_coord_ra, parameters.cdfs_jades_coord_dec,
        ] + fluxes_ref

        fluxes_meas = ["f_f606w", "f_f775w", "f_f814w"]
        config.match_tract_catalog.columns_ref_flux = fluxes_ref
        config.match_tract_catalog.columns_target_meas = [
          parameters.cdfs_acs_coord_ra, parameters.cdfs_acs_coord_dec,
        ] + fluxes_meas

        config.match_tract_catalog.columns_target_err = [
         "ra_gaia_est_error", "dec_gaia_est_error", "e_f606w", "e_f775w", "e_f814w"
        ]
        # Not supported yet
        # config.match_tract_catalog.columns_ref_err = []
  match_cdfs_mast_to_euclid:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: matched_cdfs_jades_v5p0_cdfs_hlf_v2p1
      connections.name_input_cat_target: euclid_q1
      connections.cat_output_matched: matched_cdfs_mast_euclid_q1
      match_tract_catalog.columns_target_select_false: []
      match_tract_catalog.columns_target_select_true: []
      match_tract_catalog.coord_format.column_ref_coord1: coord_mast_ra
      match_tract_catalog.coord_format.column_ref_coord2: coord_mast_dec
      match_tract_catalog.coord_format.column_target_coord1: parameters.euclid_coord_ra
      match_tract_catalog.coord_format.column_target_coord2: parameters.euclid_coord_dec
      match_tract_catalog.match_dist_max: 0.5
      refcat_sharding_type: "none"
      match_multiple_target: true
      diff_matched_catalog.columns_target_coord_err: ["right_ascension_est_error", "declination_est_error"]
      diff_matched_catalog.coord_format.column_ref_coord1: coord_mast_ra
      diff_matched_catalog.coord_format.column_ref_coord2: coord_mast_dec
      diff_matched_catalog.coord_format.column_target_coord1: parameters.euclid_coord_ra
      diff_matched_catalog.coord_format.column_target_coord2: parameters.euclid_coord_dec
      diff_matched_catalog.include_unmatched: true
      diff_matched_catalog.prefix_best_coord: "coord_best_"
      diff_matched_catalog.refcat_sharding_type: "none"
      diff_matched_catalog.column_matched_prefix_ref: ""
      diff_matched_catalog.column_matched_prefix_target: parameters.prefix_euclid
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask
        
        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)
        fluxes_ref = [f"{parameters.prefix_acs}f_f775w", f"{parameters.prefix_jades}F090W_KRON"]
        config.match_tract_catalog.columns_ref_flux = fluxes_ref
        config.match_tract_catalog.columns_ref_meas = ["coord_mast_ra", "coord_mast_dec"] + fluxes_ref

        fluxes_target = ["flux_vis_sersic", "flux_vis_sersic"]
        config.match_tract_catalog.columns_target_meas = [
          parameters.euclid_coord_ra, parameters.euclid_coord_dec,
        ] + fluxes_target

        config.match_tract_catalog.columns_target_err = [
         "right_ascension_est_error", "declination_est_error", "fluxerr_vis_sersic", "fluxerr_vis_sersic",
        ]
        # Not supported yet
        # config.match_tract_catalog.columns_ref_err = []

        config.diff_matched_catalog.columns_ref_copy = ["coord_mast_ra", "coord_mast_dec"] + [
          f"{parameters.prefix_acs}{param}" for param in parameters.columns_hlf_copy
        ] + [
          f"{parameters.prefix_jades}{param}" for param in parameters.columns_jades_v5_copy
        ]
        config.diff_matched_catalog.columns_target_copy = parameters.columns_euclid_copy

  match_object_to_cdfs_mast_euclid:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: matched_cdfs_mast_euclid_q1
      connections.name_input_cat_target: object
      connections.cat_output_matched: matched_cdfs_mast_euclid_q1_object
      match_tract_catalog.coord_format.column_ref_coord1: coord_best_ra
      match_tract_catalog.coord_format.column_ref_coord2: coord_best_dec
      match_tract_catalog.columns_target_select_false: []
      match_tract_catalog.columns_target_select_true: []
      match_multiple_target: true
      diff_matched_catalog.column_match_candidate_ref: None
      diff_matched_catalog.column_match_candidate_target: None
      diff_matched_catalog.column_matched_prefix_ref: ""
      diff_matched_catalog.columns_target_coord_err: ["sersic_raErr", "sersic_decErr"]
      diff_matched_catalog.coord_format.column_ref_coord1: coord_best_ra
      diff_matched_catalog.coord_format.column_ref_coord2: coord_best_dec
      diff_matched_catalog.include_unmatched: true
      diff_matched_catalog.prefix_best_coord: "coord_best_"
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask
        from lsst.pipe.tasks.diff_matched_tract_catalog import MatchedCatalogFluxesConfig
        
        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)
        
        prefix_jades = parameters.prefix_jades
        prefix_hst = parameters.prefix_acs
        prefix_euclid = parameters.prefix_euclid
                
        fluxes_ref = [f"{prefix_hst}f_f775w", f"{prefix_euclid}flux_vis_sersic"]
        config.match_tract_catalog.columns_ref_flux = fluxes_ref
        config.match_tract_catalog.columns_ref_meas = [
          f"{prefix_jades}{parameters.cdfs_jades_coord_ra}", f"{prefix_jades}{parameters.cdfs_jades_coord_dec}",
          f"{prefix_hst}{parameters.cdfs_acs_coord_ra}", f"{prefix_hst}{parameters.cdfs_acs_coord_dec}",
          f"{prefix_euclid}{parameters.euclid_coord_ra}", f"{prefix_euclid}{parameters.euclid_coord_dec}",
        ] + fluxes_ref
        fluxes_meas = ["i_sersicFlux", "r_sersicFlux"]
        columns_meas = ["sersic_ra", "sersic_dec"]*3 + fluxes_meas
        config.match_tract_catalog.columns_target_meas = columns_meas
        config.match_tract_catalog.columns_target_err = [f"{col}Err" for col in columns_meas]
        columns_flux = {}
        fluxes_meas_other = []
        for band in parameters.bands_lsst:
            if band in parameters.bands_match_acs:
                columns_flux[band] = MatchedCatalogFluxesConfig(
                    column_ref_flux=f"{parameters.prefix_acs}f_f775w",
                    columns_target_flux=[f"{band}_sersicFlux",],
                    columns_target_flux_err=[f"{band}_sersicFluxErr",],
                )
            else:
                fluxes_meas_other.append(f"{band}_sersicFlux")
            for model in parameters.models_other:
                fluxes_meas_other.append(f"{band}_{model}Flux")

        config.diff_matched_catalog.columns_flux = columns_flux
        config.diff_matched_catalog.columns_target_copy = parameters.columns_obj_copy + fluxes_meas_other + [
          f"{col}Err" for col in fluxes_meas_other
        ] + (parameters.columns_exponential_copy if "exponential" in parameters.models_other else [])
        config.diff_matched_catalog.columns_ref_copy = [
          "coord_best_ra", "coord_best_dec", "coord_mast_ra", "coord_mast_dec",
        ] + [
          f"{prefix_jades}{col_ref}" for col_ref in parameters.columns_jades_v5_copy
        ] + [
          f"{prefix_hst}{col_ref}" for col_ref in parameters.columns_hlf_copy
        ] + [
          f"{prefix_euclid}{col_ref}" for col_ref in parameters.columns_euclid_copy
        ]
