      python: |        
        from lsst.analysis.tools.atools.diffMatched import (
          MatchedRefCoaddDiffColorTool,
          MatchedRefCoaddDiffMagTool,
          MatchedRefCoaddDiffCoordRaTool,
          MatchedRefCoaddDiffCoordDecTool,
          MatchedRefCoaddCompurityTool,
          MatchedRefCoaddDiffDistanceTool,
          MatchedRefCoaddRatioTool,
          RangeSelector,
          ReferenceGalaxySelector,
          ReferenceObjectSelector,
          ReferenceStarSelector,
        )
        from lsst.analysis.tools.atools.genericBuild import FluxConfig
        from lsst.analysis.tools.actions.vector import (
          CompositeSelector, CoaddPlotFlagSelector, FlagSelector, GalaxySelector, MatchedTractSelector,
          RangeSelector, SetSelector, StarSelector,
        )
        
        selector_all = SetSelector(vectorKeys=["match_candidate"], values=[1])
        selector_galaxy = ReferenceGalaxySelector(
          plotLabelValue="Euclid mumax_minus_mag >= -2.6",
          vectorKey="refcat_mumax_minus_mag", threshold=-2.6, op="ge",
        )
        selector_obj = ReferenceObjectSelector(vectorKey="refcat_spurious_prob", minimum=0, maximum=0.1)
        selector_star = ReferenceStarSelector( 
          plotLabelValue="Euclid mumax_minus_mag < -2.6",
          vectorKey="refcat_mumax_minus_mag",
          threshold=-2.6, op="le",
        )
        ref_matched = FluxConfig(
            key_flux="refcat_flux_vis_sersic",
            name_flux="Euclid VIS Sersic",
            name_flux_short="Sersic_vis",
            key_flux_error=None,
        )
        MatchedRefCoaddDiffMagTool.fluxes_default.ref_matched = ref_matched

        selector_galaxy_mod = GalaxySelector(
          vectorKey="griz_model_extendedness", extendedness_minimum=0.2,
        )
        selector_star_mod = StarSelector(
          vectorKey="griz_model_extendedness", extendedness_maximum=0.2,
        )
        selector_candidate = CompositeSelector(combine_by_and=False)
        selector_candidate.selectors.ref = FlagSelector(selectWhenTrue=["refcat_match_candidate"])
        selector_candidate.selectors.target = CoaddPlotFlagSelector(
          bands=config.bands,
          selectWhenFalse=parameters.select_target_false.split(",") if parameters.select_target_false else [],
          selectWhenTrue=parameters.select_target_true.split(",") if parameters.select_target_true else [],
        )
        if parameters.patches:
          selector_comp = CompositeSelector()
          if ":" in parameters.patches:
            selector_tract_patches = CompositeSelector(combine_by_and=False)
            for tract_string in parameters.patches.split(";"):
              tract, patches = tract_string.split(":")
              values = [int(x) for x in patches.split(",")] if patches else [int(tract)]
              selector_tract = MatchedTractSelector(tract=int(tract), patches=values) if patches else (
                SetSelector(vectorKeys=["tract", "refcat_tract"], values=values))
              setattr(selector_tract_patches.selectors, f"tract_{tract}", selector_tract)
            selector_comp.selectors.tract_patches = selector_tract_patches
          else:
            values = [int(x) for x in parameters.patches.split(",")]
            selector_comp = CompositeSelector()
            selector_comp.selectors.patch = SetSelector(
              vectorKeys=["patch", "refcat_patch"],
              values=values,
            )
          selector_comp.selectors.candidate = selector_candidate
          selector_candidate = selector_comp

        lims_color_diff = (parameters.color_diff_min, parameters.color_diff_max)
        lims_mag_x = (parameters.mag_x_min, parameters.mag_x_max)
        lims_mag_chi = (parameters.mag_chi_min, parameters.mag_chi_max)
        lims_mag_diff = (parameters.mag_diff_min, parameters.mag_diff_max)
        lims_pos_chi = (parameters.pos_chi_min, parameters.pos_chi_max)
        lims_pos_diff = (parameters.pos_diff_min, parameters.pos_diff_max)
