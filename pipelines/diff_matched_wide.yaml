description: Catalog matching for wide-area surveys (more than ~6 tracts)
# imports:
#  - location: $SCIUNIT_GALAXIES_DIR/pipelines/diff_matched_parameters.yaml
parameters:
  bands_lsst: ["u", "g", "r", "i", "z", "y"]
  bands_match_des_y6gold: [ "g", "r", "i", "z", "y" ]
  bands_match_euclid: ["i"]
  columns_des_y6gold_copy: ["coadd_object_id", "ext_mash", "patch"]
  columns_euclid_copy: [
    "object_id", "right_ascension", "declination", "vis_det",
    "flux_vis_psf", "flux_y_templfit", "flux_j_templfit", "flux_h_templfit",
    "flux_vis_sersic", "flux_y_sersic", "flux_j_sersic", "flux_h_sersic",
    "fluxerr_vis_psf", "fluxerr_y_templfit", "fluxerr_j_templfit", "fluxerr_h_templfit",
    "fluxerr_vis_sersic", "fluxerr_y_sersic", "fluxerr_j_sersic", "fluxerr_h_sersic",
    "point_like_prob", "point_like_flag", "mumax_minus_mag", "spurious_flag", "spurious_prob",
    "ellipticity", "ellipticity_err", "semimajor_axis", "semimajor_axis_err",
    "position_angle", "position_angle_err", "kron_radius", "kron_radius_err",
    "gal_ebv", "gal_ebv_err", "phz_classification", "patch",
    "det_quality_flag",
  ]
  columns_exponential_copy: [
    "exponential_ra", "exponential_dec", "exponential_raErr", "exponential_decErr",
    "exponential_rho", "exponential_rhoErr",
    "exponential_reff_x", "exponential_reff_xErr", "exponential_reff_y", "exponential_reff_yErr",
    "exponential_reff_major", "exponential_reff_minor", "exponential_theta",
    "exponential_n_iter", "exponential_delta_lnL_fit_linear", "exponential_delta_lnL_fit_ps",
  ]
  columns_obj_copy: [
    "objectId", "patch", "refExtendedness", "griz_model_extendedness",
    "g_model_extendedness", "r_model_extendedness", "i_model_extendedness", "z_model_extendedness",
    "u_cModel_dev_reff_major", "g_cModel_dev_reff_major", "r_cModel_dev_reff_major",
    "i_cModel_dev_reff_major", "z_cModel_dev_reff_major", "y_cModel_dev_reff_major",
    "u_cModel_exp_reff_major", "g_cModel_exp_reff_major", "r_cModel_exp_reff_major",
    "i_cModel_exp_reff_major", "z_cModel_exp_reff_major", "y_cModel_exp_reff_major",
    "u_cModel_dev_reff_minor", "g_cModel_dev_reff_minor", "r_cModel_dev_reff_minor",
    "i_cModel_dev_reff_minor", "z_cModel_dev_reff_minor", "y_cModel_dev_reff_minor",
    "u_cModel_exp_reff_minor", "g_cModel_exp_reff_minor", "r_cModel_exp_reff_minor",
    "i_cModel_exp_reff_minor", "z_cModel_exp_reff_minor", "y_cModel_exp_reff_minor",
    "u_cModel_dev_theta", "g_cModel_dev_theta", "r_cModel_dev_theta",
    "i_cModel_dev_theta", "z_cModel_dev_theta", "y_cModel_dev_theta",
    "u_cModel_exp_theta", "g_cModel_exp_theta", "r_cModel_exp_theta",
    "i_cModel_exp_theta", "z_cModel_exp_theta", "y_cModel_exp_theta",
    "u_kronRad", "g_kronRad", "r_kronRad", "i_kronRad", "z_kronRad", "y_kronRad",
    "sersic_ra", "sersic_dec", "sersic_raErr", "sersic_decErr",
    "sersic_index", "sersic_indexErr", "sersic_rho", "sersic_rhoErr",
    "sersic_reff_x", "sersic_reff_xErr", "sersic_reff_y", "sersic_reff_yErr",
    "sersic_reff_major", "sersic_reff_minor", "sersic_theta",
    "sersic_n_iter",
    "coord_flag",
    "u_centroid_flag", "g_centroid_flag", "r_centroid_flag",
    "i_centroid_flag", "z_centroid_flag", "y_centroid_flag",
    "u_psfFlux_flag", "g_psfFlux_flag", "r_psfFlux_flag",
    "i_psfFlux_flag", "z_psfFlux_flag", "y_psfFlux_flag",
    "u_pixelFlags_saturatedCenter", "g_pixelFlags_saturatedCenter", "r_pixelFlags_saturatedCenter",
    "i_pixelFlags_saturatedCenter", "z_pixelFlags_saturatedCenter", "y_pixelFlags_saturatedCenter",
  ]
  des_y6gold_coord_ra: "alphawin_j2000"
  des_y6gold_coord_dec: "deltawin_j2000"
  euclid_coord_ra: "right_ascension"
  euclid_coord_dec: "declination"
  models_other: ["psf", "gaap1p0", "kron", "exponential", "cModel"]
  prefix_des_y6g: "desy6g_"
  prefix_euclid: "euclid_"
tasks:
  match_object_to_des_y6gold:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: des_y6gold
      connections.name_input_cat_target: object
      match_tract_catalog.columns_ref_copy: ["coadd_object_id"]
      match_tract_catalog.columns_target_copy: ["objectId"]
      match_tract_catalog.coord_format.column_ref_coord1: parameters.des_y6gold_coord_ra
      match_tract_catalog.coord_format.column_ref_coord2: parameters.des_y6gold_coord_dec
      match_tract_catalog.mag_faintest_ref: 27.0
      match_tract_catalog.match_dist_max: 0.5
      match_multiple_target: true
      diff_matched_catalog.columns_target_coord_err: ["coord_raErr", "coord_decErr"]
      diff_matched_catalog.coord_format.column_ref_coord1: parameters.des_y6gold_coord_ra
      diff_matched_catalog.coord_format.column_ref_coord2: parameters.des_y6gold_coord_dec
      diff_matched_catalog.include_unmatched: true
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask
        from lsst.pipe.tasks.diff_matched_tract_catalog import MatchedCatalogFluxesConfig

        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)
        fluxes_ref = [f"bdf_flux_{band}_corrected" for band in parameters.bands_match_des_y6gold]
        config.match_tract_catalog.columns_ref_flux = fluxes_ref
        config.match_tract_catalog.columns_ref_meas = [
          parameters.des_y6gold_coord_ra, parameters.des_y6gold_coord_dec,
        ] + fluxes_ref
        fluxes_meas = [f"{band}_sersicFlux" for band in parameters.bands_match_des_y6gold]
        columns_meas = ["coord_ra", "coord_dec"] + fluxes_meas
        config.match_tract_catalog.columns_target_meas = columns_meas
        config.match_tract_catalog.columns_target_err = [f"{col}Err" for col in columns_meas]

        columns_flux = {}
        fluxes_meas_other = []
        for band in parameters.bands_lsst:
            if band in parameters.bands_match_des_y6gold:
                columns_flux[band] = MatchedCatalogFluxesConfig(
                    column_ref_flux=f"bdf_flux_{band}_corrected",
                    columns_target_flux=[f"{band}_sersicFlux",],
                    columns_target_flux_err=[f"{band}_sersicFluxErr",],
                )
            else:
                fluxes_meas_other.append(f"{band}_sersicFlux")
            for model in parameters.models_other:
                fluxes_meas_other.append(f"{band}_{model}Flux")
        config.diff_matched_catalog.columns_flux = columns_flux
        config.diff_matched_catalog.columns_ref_copy = parameters.columns_des_y6gold_copy
        config.diff_matched_catalog.columns_target_copy = parameters.columns_obj_copy + fluxes_meas_other + [
          f"{col}Err" for col in fluxes_meas_other
        ] + (parameters.columns_exponential_copy if "exponential" in parameters.models_other else [])
  match_object_to_euclid:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: euclid_q1
      connections.name_input_cat_target: object
      match_tract_catalog.columns_ref_copy: ["object_id"]
      match_tract_catalog.columns_target_copy: ["objectId"]
      match_tract_catalog.coord_format.column_ref_coord1: parameters.euclid_coord_ra
      match_tract_catalog.coord_format.column_ref_coord2: parameters.euclid_coord_dec
      match_tract_catalog.mag_faintest_ref: 28
      match_multiple_target: true
      diff_matched_catalog.coord_format.column_ref_coord1: parameters.euclid_coord_ra
      diff_matched_catalog.coord_format.column_ref_coord2: parameters.euclid_coord_dec
      diff_matched_catalog.columns_target_coord_err: ["coord_raErr", "coord_decErr"]
      diff_matched_catalog.include_unmatched: true
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask
        from lsst.pipe.tasks.diff_matched_tract_catalog import MatchedCatalogFluxesConfig
        
        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)
        
        fluxes_ref = ["flux_vis_sersic"]
        config.match_tract_catalog.columns_ref_flux = fluxes_ref
        config.match_tract_catalog.columns_ref_meas = [
          parameters.euclid_coord_ra, parameters.euclid_coord_dec,
        ] + fluxes_ref
        fluxes_meas = [f"{band}_sersicFlux" for band in parameters.bands_match_euclid]
        columns_meas = ["coord_ra", "coord_dec"] + fluxes_meas
        config.match_tract_catalog.columns_target_meas = columns_meas
        config.match_tract_catalog.columns_target_err = [f"{col}Err" for col in columns_meas]

        columns_flux = {}
        fluxes_meas_other = []
        for band in parameters.bands_lsst:
            if band in parameters.bands_match_euclid:
                columns_flux[band] = MatchedCatalogFluxesConfig(
                    column_ref_flux="flux_vis_sersic",
                    columns_target_flux=[f"{band}_sersicFlux",],
                    columns_target_flux_err=[f"{band}_sersicFluxErr",],
                )
            else:
                fluxes_meas_other.append(f"{band}_sersicFlux")
            for model in parameters.models_other:
                fluxes_meas_other.append(f"{band}_{model}Flux")
        config.diff_matched_catalog.columns_flux = columns_flux
        config.diff_matched_catalog.columns_ref_copy = parameters.columns_euclid_copy
        config.diff_matched_catalog.columns_target_copy = parameters.columns_obj_copy + fluxes_meas_other + [
          f"{col}Err" for col in fluxes_meas_other
        ] + (parameters.columns_exponential_copy if "exponential" in parameters.models_other else [])
