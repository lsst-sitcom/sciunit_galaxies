description: Catalog matching and analysis for HSC with COSMOS
imports:
  - location: $SCIUNIT_GALAXIES_DIR/pipelines/matchWide.yaml
    labeledSubsetModifyMode: EDIT
    exclude:
      - matchObjectToDesY6gold
      - matchObjectToDp1
      - matchObjectToEuclid
parameters:
  bands_match: ["g", "r", "i", "z", "y"]
  bands_match_acs: ["i"]
  bands_match_shear: ["g", "r", "i", "z"]
  columns_cosmos2020_copy: [
    "ALPHA_J2000", "DELTA_J2000", "FLAG_HSC", "FLAG_COMBINED", "lp_type", "patch",
    "HSC_g_FLUX_AUTO", "HSC_r_FLUX_AUTO", "HSC_i_FLUX_AUTO", "HSC_z_FLUX_AUTO", "HSC_y_FLUX_AUTO",
  ]
  columns_cosmos2025_copy: [
    "id", "ra", "dec", "ra_model", "dec_model", "patch",
    "flux_auto_hst-f814w", "flux_err_auto_hst-f814w",
    "flux_auto_f115w", "flux_err_auto_f115w", "flux_auto_f150w", "flux_err_auto_f150w", "flux_auto_f277w", "flux_err_auto_f277w",
    "mu_max_hst-f814w", "mu_max_f115w",  "mu_max_f150w", "mu_max_f277w",
    "flag_star", "flag_blend",
    "radius_sersic", "radius_sersic_err", "axratio_sersic", "axratio_sersic_err",
    "sersic", "sersic_err", "angle_sersic", "angle_sersic_err", "e1", "e1_err", "e2", "e2_err",
    "flux_model_hst-f814w", "flux_model_f115w", "flux_model_f150w", "flux_model_f277w",
    "flux_model_cfht-u", "flux_model_hsc-g", "flux_model_hsc-r",
    "flux_model_hsc-i", "flux_model_hsc-z", "flux_model_hsc-y",
    "flux_err-cal_model_hst-f814w", "flux_err-cal_model_f115w", "flux_err-cal_model_f150w", "flux_err-cal_model_f277w",
    "flux_err-cal_model_cfht-u", "flux_err-cal_model_hsc-g", "flux_err-cal_model_hsc-r",
    "flux_err-cal_model_hsc-i", "flux_err-cal_model_hsc-z", "flux_err-cal_model_hsc-y",
    "flux_err-uncal_model_hst-f814w", "flux_err-uncal_model_f115w", "flux_err-uncal_model_f150w", "flux_err-uncal_model_f277w",
    "flux_err-uncal_model_cfht-u", "flux_err-uncal_model_hsc-g", "flux_err-uncal_model_hsc-r",
    "flux_err-uncal_model_hsc-i", "flux_err-uncal_model_hsc-z", "flux_err-uncal_model_hsc-y",
    "warn_flag", "zfinal", "type",
  ]
  columns_cosmos_acs_copy: [
    "class_star", "flux_auto", "fluxerr_auto", "kron_radius", "mu_class", "number", "ra", "dec", "patch",
    "flux_radius", "petro_radius",
  ]
  columns_cosmos_desi_copy: [
    'TARGETID', 'TARGET_RA', 'TARGET_DEC', 'TARGET_RA_est_error', 'TARGET_DEC_est_error',
    'patch', 'PMRA', 'PMDEC',
    'OBJTYPE', 'SPECTYPE', 'SUBTYPE',
    'Z', 'ZERR', 'ZWARN', 'BEST_Z', 'DZ', 'QUALITY_Z', 'DELTACHI2', 'CHI2',
    'SURVEY', 'PROGRAM',
  ]
  cosmos2020_coord_ra: "ALPHA_J2000"
  cosmos2020_coord_dec: "DELTA_J2000"
  cosmos2025_coord_ra: "ra"
  cosmos2025_coord_dec: "dec"
  cosmos_acs_coord_ra: "ra"
  cosmos_acs_coord_dec: "dec"
  cosmos_desi_coord_ra: "TARGET_RA"
  cosmos_desi_coord_dec: "TARGET_DEC"

  prefix_acs: "hst_"
  prefix_cosmos2025: "cosmos2025_"
  prefix_desi: "desi_"
  prefix_hsc: "hsc_"
  # Prefix for NASA space telescopes, from the MAST archive
  prefix_mast: "mast_"
tasks:
  matchObjectToCosmos2020:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: cosmos2020_classic_v2p2
      connections.name_input_cat_target: object
      match_tract_catalog.coord_format.column_ref_coord1: parameters.cosmos2020_coord_ra
      match_tract_catalog.coord_format.column_ref_coord2: parameters.cosmos2020_coord_dec
      refcat_sharding_type: "none"

      match_tract_catalog.columns_target_select_true: []
      match_tract_catalog.columns_target_select_false: []
      match_tract_catalog.mag_faintest_ref: 29.0
      match_tract_catalog.columns_ref_copy: ["ID"]
      match_tract_catalog.columns_target_copy: ["objectId"]

      diff_matched_catalog.columns_target_coord_err: [ "coord_raErr", "coord_decErr" ]
      diff_matched_catalog.coord_format.column_ref_coord1: parameters.cosmos2020_coord_ra
      diff_matched_catalog.coord_format.column_ref_coord2: parameters.cosmos2020_coord_dec
      diff_matched_catalog.include_unmatched: true
      diff_matched_catalog.refcat_sharding_type: "none"
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask
        from lsst.pipe.tasks.diff_matched_tract_catalog import MatchedCatalogFluxesConfig

        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)
        fluxes_ref = [f"HSC_{band}_FLUX_AUTO" for band in parameters.bands_match]
        config.match_tract_catalog.columns_ref_flux = fluxes_ref
        config.match_tract_catalog.columns_ref_meas = [
          parameters.cosmos2020_coord_ra, parameters.cosmos2020_coord_dec,
        ] + fluxes_ref
        fluxes_meas = [f"{band}_sersicFlux" for band in parameters.bands_match]
        columns_meas = [parameters.object_ra, parameters.object_dec] + fluxes_meas
        config.match_tract_catalog.columns_target_meas = columns_meas
        config.match_tract_catalog.columns_target_err = [f"{col}Err" for col in columns_meas]
        # Might need adjusting for different survey depths

        columns_flux = {}
        fluxes_meas_other = []
        for band in parameters.bands_match:
            columns_flux[band] = MatchedCatalogFluxesConfig(
                column_ref_flux=f"HSC_{band}_FLUX_AUTO",
                columns_target_flux=[f"{band}_sersicFlux",],
                columns_target_flux_err=[f"{band}_sersicFluxErr",],
            )
            for model in parameters.models_other:
              fluxes_meas_other.append(f"{band}_{model}Flux")
        config.diff_matched_catalog.columns_flux = columns_flux
        config.diff_matched_catalog.columns_ref_copy = parameters.columns_cosmos2020_copy
        config.diff_matched_catalog.columns_target_copy = parameters.columns_obj_copy + fluxes_meas_other + [
          f"{col}Err" for col in fluxes_meas_other
        ]
  matchObjectToCosmos2025:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: cosmos2025_v1
      connections.name_input_cat_target: object

      match_tract_catalog.coord_format.column_ref_coord1: parameters.cosmos2025_coord_ra
      match_tract_catalog.coord_format.column_ref_coord2: parameters.cosmos2025_coord_dec
      refcat_sharding_type: "none"

      match_tract_catalog.columns_target_select_true: []
      match_tract_catalog.columns_target_select_false: []

      diff_matched_catalog.columns_target_coord_err: [ "coord_raErr", "coord_decErr" ]
      diff_matched_catalog.coord_format.column_ref_coord1: parameters.cosmos2025_coord_ra
      diff_matched_catalog.coord_format.column_ref_coord2: parameters.cosmos2025_coord_dec
      diff_matched_catalog.include_unmatched: true
      diff_matched_catalog.refcat_sharding_type: "none"
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask
        from lsst.pipe.tasks.diff_matched_tract_catalog import MatchedCatalogFluxesConfig

        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)

        fluxes_ref = [f"flux_model_hsc-{band}" for band in parameters.bands_match]
        config.match_tract_catalog.columns_ref_flux = fluxes_ref
        config.match_tract_catalog.columns_ref_meas = [
          parameters.cosmos2025_coord_ra, parameters.cosmos2025_coord_dec,
        ] + fluxes_ref
        fluxes_meas = [f"{band}_sersicFlux" for band in parameters.bands_match]
        columns_meas = [parameters.object_ra, parameters.object_dec] + fluxes_meas
        config.match_tract_catalog.columns_target_meas = columns_meas
        config.match_tract_catalog.columns_target_err = [f"{col}Err" for col in columns_meas]
        # Might need adjusting for different survey depths
        config.match_tract_catalog.mag_faintest_ref = 29.0
        config.match_tract_catalog.columns_ref_copy = ["id"]
        config.match_tract_catalog.columns_target_copy = ["objectId"]

        columns_flux = {}
        fluxes_meas_other = []
        for band in "ugrizy":
          if band in parameters.bands_match:
            columns_flux[band] = MatchedCatalogFluxesConfig(
                column_ref_flux=f"flux_model_hsc-{band}",
                columns_target_flux=[f"{band}_sersicFlux",],
                columns_target_flux_err=[f"{band}_sersicFluxErr",],
            )
            models_add = ["sersic"]
          else:
            models_add = []
          for model in models_add + parameters.models_other:
            fluxes_meas_other.append(f"{band}_{model}Flux")
        config.diff_matched_catalog.columns_flux = columns_flux
        config.diff_matched_catalog.columns_ref_copy = parameters.columns_cosmos2025_copy
        config.diff_matched_catalog.columns_target_copy = parameters.columns_obj_copy + fluxes_meas_other + [
          f"{col}Err" for col in fluxes_meas_other
        ]
  matchObjectToCosmosAcs:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: cosmos_acs_iphot_200709
      connections.name_input_cat_target: object
      match_tract_catalog.coord_format.column_ref_coord1: parameters.cosmos_acs_coord_ra
      match_tract_catalog.coord_format.column_ref_coord2: parameters.cosmos_acs_coord_dec
      refcat_sharding_type: "none"

      match_tract_catalog.columns_target_select_true: []
      match_tract_catalog.columns_target_select_false: []

      diff_matched_catalog.columns_target_coord_err: [ "coord_raErr", "coord_decErr" ]
      diff_matched_catalog.coord_format.column_ref_coord1: parameters.cosmos_acs_coord_ra
      diff_matched_catalog.coord_format.column_ref_coord2: parameters.cosmos_acs_coord_dec
      diff_matched_catalog.include_unmatched: true
      diff_matched_catalog.refcat_sharding_type: "none"
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask
        from lsst.pipe.tasks.diff_matched_tract_catalog import MatchedCatalogFluxesConfig

        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)

        fluxes_ref = ["flux_auto"]
        config.match_tract_catalog.columns_ref_flux = fluxes_ref
        config.match_tract_catalog.columns_ref_meas = [
          parameters.cosmos_acs_coord_ra, parameters.cosmos_acs_coord_dec,
        ] + fluxes_ref
        config.match_tract_catalog.match_dist_max = 1.0
        fluxes_meas = [f"{band}_sersicFlux" for band in parameters.bands_match_acs]
        columns_meas = [parameters.object_ra, parameters.object_dec] + fluxes_meas
        config.match_tract_catalog.columns_target_meas = columns_meas
        config.match_tract_catalog.columns_target_err = [f"{col}Err" for col in columns_meas]
        # Might need adjusting for different survey depths
        config.match_tract_catalog.mag_faintest_ref = 29.0

        columns_flux = {}
        fluxes_meas_other = []
        for band in parameters.bands_lsst:
            if band in parameters.bands_match_acs:
              columns_flux[band] = MatchedCatalogFluxesConfig(
                  column_ref_flux="flux_auto",
                  columns_target_flux=[f"{band}_sersicFlux"],
                  columns_target_flux_err=[f"{band}_sersicFluxErr"],
              )
            else:
                fluxes_meas_other.append(f"{band}_sersicFlux")
            for model in parameters.models_other:
                fluxes_meas_other.append(f"{band}_{model}Flux")
        config.diff_matched_catalog.columns_flux = columns_flux
        config.diff_matched_catalog.columns_target_copy = parameters.columns_obj_copy + fluxes_meas_other + [
          f"{col}Err" for col in fluxes_meas_other
        ]
        config.diff_matched_catalog.columns_ref_copy = parameters.columns_cosmos_acs_copy
  matchCosmosAcsToCosmos2025:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: cosmos2025_v1
      connections.name_input_cat_target: cosmos_acs_iphot_200709
      connections.cat_output_matched: matched_cosmos_mast
      match_tract_catalog.coord_format.column_ref_coord1: parameters.cosmos2025_coord_ra
      match_tract_catalog.coord_format.column_ref_coord2: parameters.cosmos2025_coord_dec
      match_tract_catalog.coord_format.column_target_coord1: parameters.cosmos_acs_coord_ra
      match_tract_catalog.coord_format.column_target_coord2: parameters.cosmos_acs_coord_dec
      match_tract_catalog.match_dist_max: 0.5

      match_tract_catalog.columns_target_select_false: []
      match_tract_catalog.columns_target_select_true: []

      refcat_sharding_type: "none"
      target_sharding_type: "none"
      match_multiple_target: false
      diff_matched_catalog.columns_target_coord_err: ["ra_est_error", "dec_est_error"]
      diff_matched_catalog.coord_format.column_ref_coord1: parameters.cosmos2025_coord_ra
      diff_matched_catalog.coord_format.column_ref_coord2: parameters.cosmos2025_coord_dec
      diff_matched_catalog.coord_format.column_target_coord1: parameters.cosmos_acs_coord_ra
      diff_matched_catalog.coord_format.column_target_coord2: parameters.cosmos_acs_coord_dec
      diff_matched_catalog.include_unmatched: true
      diff_matched_catalog.prefix_best_coord: "coord_mast_"
      diff_matched_catalog.refcat_sharding_type: "none"
      diff_matched_catalog.target_sharding_type: "none"
      diff_matched_catalog.column_match_prefix: prefix_match
      diff_matched_catalog.column_matched_prefix_ref: parameters.prefix_cosmos2025
      diff_matched_catalog.column_matched_prefix_target: parameters.prefix_acs
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask

        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)

        prefix_match = parameters.prefix_cosmos2025 + parameters.prefix_acs
        fluxes_ref = ["flux_auto_hst-f814w"]
        config.match_tract_catalog.columns_ref_meas = [
          parameters.cosmos2025_coord_ra, parameters.cosmos2025_coord_dec,
        ] + fluxes_ref

        fluxes_meas = ["flux_auto"]
        config.match_tract_catalog.columns_ref_flux = fluxes_ref
        config.match_tract_catalog.columns_target_meas = [
          parameters.cosmos_acs_coord_ra, parameters.cosmos_acs_coord_dec,
        ] + fluxes_meas

        config.match_tract_catalog.columns_target_err = [
         "ra_est_error", "dec_est_error", "fluxerr_auto",
        ]
        # Not supported yet
        # config.match_tract_catalog.columns_ref_err = [
        #  "right_ascension_est_error", "declination_est_error", f"fluxerr_vis_sersic",
        # ]
        # Might need adjusting for different survey depths
        config.match_tract_catalog.mag_faintest_ref = 27.0
        config.match_tract_catalog.columns_ref_copy = ["id"]
        config.match_tract_catalog.columns_target_copy = ["number"]

        config.diff_matched_catalog.columns_ref_copy = parameters.columns_cosmos2025_copy
        config.diff_matched_catalog.columns_target_copy = parameters.columns_cosmos_acs_copy
  matchCosmosMastToDesi:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: matched_cosmos_mast
      connections.name_input_cat_target: cosmos_desi_v2p0
      connections.cat_output_matched: matched_cosmos_mast_desi
      match_tract_catalog.coord_format.column_ref_coord1: coord_mast_ra
      match_tract_catalog.coord_format.column_ref_coord2: coord_mast_dec
      match_tract_catalog.coord_format.column_target_coord1: parameters.cosmos_desi_coord_ra
      match_tract_catalog.coord_format.column_target_coord2: parameters.cosmos_desi_coord_dec
      match_tract_catalog.columns_ref_flux: fluxes_ref
      match_tract_catalog.columns_ref_meas: ["coord_mast_ra", "coord_mast_dec"]
      match_tract_catalog.columns_target_select_false: []
      match_tract_catalog.columns_target_select_true: []
      refcat_sharding_type: "none"
      target_sharding_type: "none"

      diff_matched_catalog.column_match_prefix: prefix_match
      diff_matched_catalog.column_matched_prefix_ref: ""
      diff_matched_catalog.column_matched_prefix_target: parameters.prefix_desi
      diff_matched_catalog.columns_target_coord_err: ["TARGET_RA_est_error", "TARGET_DEC_est_error"]
      diff_matched_catalog.coord_format.column_ref_coord1: coord_mast_ra
      diff_matched_catalog.coord_format.column_ref_coord2: coord_mast_dec
      diff_matched_catalog.coord_format.column_target_coord1: parameters.cosmos_desi_coord_ra
      diff_matched_catalog.coord_format.column_target_coord2: parameters.cosmos_desi_coord_dec
      diff_matched_catalog.include_unmatched: true
      diff_matched_catalog.prefix_best_coord: "coord_mast_desi_"
      diff_matched_catalog.refcat_sharding_type: "none"
      diff_matched_catalog.target_sharding_type: "none"
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask

        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)

        prefix_hst = parameters.prefix_acs
        prefix_cosmos2025 = parameters.prefix_cosmos2025
        prefix_match = f"{parameters.prefix_mast}{parameters.prefix_desi}"

        fluxes_ref = [f"{prefix_hst}flux_auto", f"{prefix_cosmos2025}flux_auto_hst-f814w"]
        columns_meas = [parameters.cosmos_desi_coord_ra, parameters.cosmos_desi_coord_dec]
        config.match_tract_catalog.columns_target_meas = columns_meas
        config.match_tract_catalog.columns_target_err = [
          f"{parameters.cosmos_desi_coord_ra}_est_error", f"{parameters.cosmos_desi_coord_dec}_est_error",
        ]
        # Might need adjusting for different survey depths
        columns_ref_copy = [f"{prefix_hst}number", f"{prefix_cosmos2025}id"]
        config.match_tract_catalog.columns_ref_copy = columns_ref_copy

        from lsst.pipe.tasks.diff_matched_tract_catalog import MatchedCatalogFluxesConfig

        config.diff_matched_catalog.columns_flux = []
        config.diff_matched_catalog.columns_target_copy = parameters.columns_cosmos_desi_copy
        config.diff_matched_catalog.columns_ref_copy = [
          "coord_mast_ra", "coord_mast_dec",
        ] + [
          f"{prefix_hst}{col_ref}" for col_ref in parameters.columns_cosmos_acs_copy
        ] + [
          f"{prefix_cosmos2025}{col_ref}" for col_ref in parameters.columns_cosmos2025_copy
        ]
  matchObjectToCosmosMastDesi:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: matched_cosmos_mast_desi
      connections.name_input_cat_target: object
      connections.cat_output_matched: matched_cosmos_mast_desi_object
      match_tract_catalog.coord_format.column_ref_coord1: coord_mast_desi_ra
      match_tract_catalog.coord_format.column_ref_coord2: coord_mast_desi_dec
      match_tract_catalog.coord_format.column_target_coord1: parameters.object_ra
      match_tract_catalog.coord_format.column_target_coord2: parameters.object_dec
      match_tract_catalog.columns_target_select_false: []
      match_tract_catalog.columns_target_select_true: []
      refcat_sharding_type: "none"

      diff_matched_catalog.column_matched_prefix_ref: ""
      diff_matched_catalog.columns_target_coord_err: ["sersic_raErr", "sersic_decErr"]
      diff_matched_catalog.coord_format.column_ref_coord1: coord_mast_desi_ra
      diff_matched_catalog.coord_format.column_ref_coord2: coord_mast_desi_dec
      diff_matched_catalog.coord_format.column_target_coord1: parameters.object_ra
      diff_matched_catalog.coord_format.column_target_coord2: parameters.object_dec

      diff_matched_catalog.include_unmatched: true
      diff_matched_catalog.prefix_best_coord: "coord_best_"
      diff_matched_catalog.refcat_sharding_type: "none"
      output_matched_catalog: true

      python: |
        # Target settings are likely common to all object tables
        from lsst.pipe.tasks.match_tract_catalog_probabilistic import MatchTractCatalogProbabilisticTask

        config.match_tract_catalog.retarget(MatchTractCatalogProbabilisticTask)

        prefix_hst = parameters.prefix_acs
        prefix_cosmos2025 = parameters.prefix_cosmos2025
        prefix_desi = parameters.prefix_desi

        fluxes_ref = [f"{prefix_hst}flux_auto", f"{prefix_cosmos2025}flux_auto_hst-f814w"]
        config.match_tract_catalog.columns_ref_flux = fluxes_ref
        config.match_tract_catalog.columns_ref_meas = [
          f"{prefix_hst}{parameters.cosmos_acs_coord_ra}", f"{prefix_hst}{parameters.cosmos_acs_coord_dec}",
          f"{prefix_cosmos2025}{parameters.cosmos2025_coord_ra}", f"{prefix_cosmos2025}{parameters.cosmos2025_coord_dec}",
        ] + fluxes_ref
        fluxes_meas = ["i_sersicFlux", "i_sersicFlux"]
        columns_meas = ["sersic_ra", "sersic_dec"]*2 + fluxes_meas
        config.match_tract_catalog.columns_target_meas = columns_meas
        config.match_tract_catalog.columns_target_err = [f"{col}Err" for col in columns_meas]
        # Might need adjusting for different survey depths
        columns_ref_copy = [f"{prefix_hst}number", f"{prefix_cosmos2025}id"]
        config.match_tract_catalog.columns_ref_copy = columns_ref_copy
        config.match_tract_catalog.columns_target_copy = ["objectId"]

        from lsst.pipe.tasks.diff_matched_tract_catalog import MatchedCatalogFluxesConfig

        columns_flux = {}
        fluxes_meas_other = []
        for band in "ugrizy":
            if band == "i":
                columns_flux[band] = MatchedCatalogFluxesConfig(
                    column_ref_flux=f"{prefix_hst}flux_auto",
                    columns_target_flux=[f"{band}_sersicFlux",],
                    columns_target_flux_err=[f"{band}_sersicFluxErr",],
                )
            else:
                fluxes_meas_other.append(f"{band}_sersicFlux")
            for model in parameters.models_other:
                fluxes_meas_other.append(f"{band}_{model}Flux")

        config.diff_matched_catalog.columns_flux = columns_flux
        config.diff_matched_catalog.columns_target_copy = parameters.columns_obj_copy + fluxes_meas_other + [
          f"{col}Err" for col in fluxes_meas_other
        ] + (parameters.columns_exponential_copy if "exponential" in parameters.models_other else [])
        config.diff_matched_catalog.columns_ref_copy = [
          "coord_mast_ra", "coord_mast_dec", "coord_mast_desi_ra", "coord_mast_desi_dec",
        ] + [
          f"{prefix_hst}{col_ref}" for col_ref in parameters.columns_cosmos_acs_copy
        ] + [
          f"{prefix_cosmos2025}{col_ref}" for col_ref in parameters.columns_cosmos2025_copy
        ] + [
          f"{prefix_desi}{col_ref}" for col_ref in parameters.columns_cosmos_desi_copy
        ]
  matchHscToCosmosAcs:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: cosmos_acs_iphot_200709
      connections.name_input_cat_target: rc2_object_hsc
      match_tract_catalog.coord_format.column_ref_coord1: parameters.cosmos_acs_coord_ra
      match_tract_catalog.coord_format.column_ref_coord2: parameters.cosmos_acs_coord_dec
      match_tract_catalog.coord_format.column_target_coord1: parameters.object_ra
