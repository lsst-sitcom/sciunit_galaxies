      python: |        
        from lsst.analysis.tools.atools.diffMatched import (
          MatchedRefCoaddCompurityTool,
          MatchedRefCoaddDiffColorTool,
          MatchedRefCoaddDiffDistanceTool,
          MatchedRefCoaddDiffMagTool,
          MatchedRefCoaddDiffCoordRaTool,
          MatchedRefCoaddDiffCoordDecTool,
          MatchedRefCoaddRatioTool,
          ReferenceGalaxySelector,
          ReferenceObjectSelector,
          ReferenceStarSelector,
        )
        from lsst.analysis.tools.atools.genericBuild import FluxConfig
        from lsst.analysis.tools.actions.vector import (
          CoaddPlotFlagSelector, CompositeSelector, FlagSelector, GalaxySelector, RangeSelector,
          SetSelector, StarSelector,
        )
        
        bands_color = {"g": "r", "r": "i", "i": "z", "z": "y"}
        
        selector_all = RangeSelector(vectorKey="objectId")
        selector_galaxy = ReferenceGalaxySelector(
          plotLabelKey="Selection: LePhare galaxies", vectorKey="refcat_type",
        )
        selector_obj = ReferenceObjectSelector(vectorKey="refcat_type", maximum=1)
        selector_star = ReferenceStarSelector(
          plotLabelKey="Selection: LePhare stars", vectorKey="refcat_type",
        )
        selector_galaxy_mod = GalaxySelector(
          vectorKey="griz_model_extendedness", extendedness_minimum=0.2,
        )
        selector_star_mod = StarSelector(
          vectorKey="griz_model_extendedness", extendedness_maximum=0.2,
        )
        selector_candidate = CompositeSelector(combine_by_and=False)
        selector_candidate.selectors.ref = FlagSelector(selectWhenTrue=["refcat_match_candidate"])
        selector_candidate.selectors.target = CoaddPlotFlagSelector(
          bands=config.bands,
          selectWhenFalse=parameters.select_target_false.split(",") if parameters.select_target_false else [],
          selectWhenTrue=parameters.select_target_true.split(",") if parameters.select_target_true else [],
        )
        if parameters.patches_hst:
          selector_candidate_new = CompositeSelector(combine_by_and=True)
          selector_candidate_new.selectors.flag = selector_candidate
          selector_candidate_new.selectors.patch = SetSelector(
            vectorKeys=["patch", "refcat_patch"],
            values=parameters.patches_hst,
          )
          selector_candidate = selector_candidate_new 

        ref_matched = FluxConfig(
            key_flux="refcat_flux_model_hsc-{band}",
            name_flux="HSC Sersic",
            name_flux_short="HSC_sersic",
            key_flux_error=None,
        )
        lims_color_diff = (parameters.color_diff_min, parameters.color_diff_max)
        lims_mag_x = (parameters.mag_x_min, parameters.mag_x_max)
        lims_mag_chi = (parameters.mag_chi_min, parameters.mag_chi_max)
        lims_mag_diff = (parameters.mag_diff_min, parameters.mag_diff_max)
        lims_pos_chi = (parameters.pos_chi_min, parameters.pos_chi_max)
